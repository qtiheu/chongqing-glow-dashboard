name: 每日朝霞晚霞预报与微信推送

on:
  # ⚠ GitHub Actions 的 cron 一律使用 UTC 时间（不支持时区字段）。
  #   如需调整推送时间，按"北京时间 − 8 小时"换算后填写。
  schedule:
    # UTC 07:35 = 北京时间 15:35 → 推送当晚晚霞
    - cron: "35 7 * * *"
    # UTC 13:35 = 北京时间 21:35 → 推送次日朝霞
    - cron: "35 13 * * *"
  # 支持手动触发 + 外部定时服务（cron-job.org 等）通过 workflow_dispatch 调用。
  # 通过输入参数 event 区分推送对象，避免外部触发时两条都推。
  workflow_dispatch:
    inputs:
      event:
        description: "要推送的预报：sunset=当晚晚霞 / sunrise=次日朝霞 / all=都推"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - sunset
          - sunrise

env:
  # 鲜艳度 ≥ 该阈值时，推送标题加【🔥值得出门】前缀（可按需调整）
  PUSH_THRESHOLD: "0.6"

jobs:
  forecast-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 提交 data/*.json 需要写权限
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: 抓取预报数据
        run: python pipeline/scraper.py

      # 推送对象判断：
      #  - schedule 触发：按 cron 匹配（35 7 → 晚霞，35 13 → 朝霞）
      #  - workflow_dispatch 触发：按输入参数 event 决定（sunset / sunrise / all）
      - name: 推送当晚晚霞预报（北京 15:35 触发）
        if: >
          github.event.schedule == '35 7 * * *' ||
          (github.event_name == 'workflow_dispatch' &&
           (github.event.inputs.event == 'sunset' || github.event.inputs.event == 'all'))
        continue-on-error: true # 推送失败不阻塞数据提交；失败原因见该步日志
        run: python pipeline/push.py --event sunset
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSH_THRESHOLD: ${{ env.PUSH_THRESHOLD }}

      - name: 推送次日朝霞预报（北京 21:35 触发）
        if: >
          github.event.schedule == '35 13 * * *' ||
          (github.event_name == 'workflow_dispatch' &&
           (github.event.inputs.event == 'sunrise' || github.event.inputs.event == 'all'))
        continue-on-error: true
        run: python pipeline/push.py --event sunrise
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSH_THRESHOLD: ${{ env.PUSH_THRESHOLD }}

      - name: 提交并推送数据更新
        if: always() # 无论推送是否失败，抓取到的数据都提交回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast.json data/history.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 更新朝霞晚霞预报数据 $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi
